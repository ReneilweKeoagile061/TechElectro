name: CI — TechElectro Inventory Analytics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    env:
      HAS_AZURE_SECRET: ${{ secrets.AZURE_SQL_SERVER != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check formatting (black)
        run: black --check --line-length 100 app.py generate_charts.py tests/

      - name: Lint (flake8)
        run: flake8 --extend-ignore=E501,E203,W503 app.py generate_charts.py tests/

      - name: Run unit tests
        run: pytest tests/ -v --ignore=tests/test_azure_connection.py
        env:
          PYTHONPATH: .

      - name: Run Azure smoke test
        if: env.HAS_AZURE_SECRET == 'true'
        run: pytest tests/test_azure_connection.py -v
        env:
          PYTHONPATH: .
          server: ${{ secrets.AZURE_SQL_SERVER }}
          database: ${{ secrets.AZURE_SQL_DATABASE }}
          username: ${{ secrets.AZURE_SQL_USERNAME }}
          password: ${{ secrets.AZURE_SQL_PASSWORD }}

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t techelectro-dashboard:${{ github.sha }} .

      - name: Verify image starts
        run: |
          docker run -d --name test-app -p 8501:8501 \
            -e server="" -e database="" -e username="" -e password="" \
            techelectro-dashboard:${{ github.sha }}
          sleep 8
          curl -f http://localhost:8501/_stcore/health || echo "Health check skipped (no DB in CI)"
          docker stop test-app

